name: atlas-validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  atlas-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Subject Atlas
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Checkout reference-atlas-core v1 contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: akaitigo/reference-atlas-core
          ref: 072d7ca77981f51754e824d70c6d4ecd55ea67e5
          path: .atlas-core

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.26.0"
          cache-dependency-path: .atlas-core/go.sum

      - name: Run atlas validate and audit
        run: make ATLAS_CORE="$GITHUB_WORKSPACE/.atlas-core" atlas-validate atlas-audit

      - name: Validate Atlas graph and Lab contracts
        run: |
          python3 scripts/validate_graph.py
          python3 scripts/validate_definitive_inventory.py
          python3 scripts/validate_scenario_proofs.py
          python3 scripts/test_scenario_gap_closure.py
          python3 scripts/test_atomic_evidence_publish.py
          make ATLAS_CORE="$GITHUB_WORKSPACE/.atlas-core" evidence-dependency-validate
          python3 scripts/validate_authority_locators.py
          python3 scripts/validate_authority_body_inventory.py
          python3 scripts/validate_authority_review_queue.py
          python3 scripts/test_authority_review_queue.py
          python3 scripts/validate_non_regression.py
          python3 scripts/validate_evidence_artifacts.py
          scripts/environment.sh dry-run
          tests/labs/static.sh
          tests/labs/extended-static.sh

      - name: Validate Router Skill and Evals
        run: |
          python3 scripts/validate_router_evals.py
          python3 scripts/validate_definitive_skill_eval.py

      - name: Validate legal and provenance gate
        run: |
          python3 scripts/validate_legal.py
          python3 scripts/generate_sbom.py --check

      - name: Validate DCO sign-off
        if: github.event_name == 'pull_request'
        run: scripts/validate_dco.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
