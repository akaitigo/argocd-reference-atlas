schema_version: 1
atlas_id: argocd-reference-atlas
epoch: "2026-08-28"
authority_lock_digest: sha256:fc76f2c5267059ae59c118c9f4924c51e4ca179476a687cced7f43ae1c977674
target_sets:
  - id: control-loop
    title: 宣言状態と制御ループ
    sequence: 1
    completion_required: true
    exit_criteria:
      - Applicationの宣言状態をローカルクラスタへ反映して観測できること
      - 差分検出から収束までのReconciliationを反復して検証できること
  - id: delivery
    title: 配布判断と状態評価
    sequence: 2
    completion_required: true
    exit_criteria:
      - Sync順序、Diff、Healthの主要判断を固定入力で再実行できること
      - PromotionをGit上の宣言変更として追跡し前後の状態を比較できること
  - id: security-boundary
    title: 秘密情報の境界
    sequence: 3
    completion_required: true
    exit_criteria:
      - GitとEvidenceにSecret平文を残さない境界を自動検査できること
      - Secret取得または復号の責任主体と拒否条件を説明できること
  - id: resilience
    title: 障害と復旧
    sequence: 4
    completion_required: true
    exit_criteria:
      - 専用ローカルクラスタ内で主要依存障害を安全に注入できること
      - Argo CD状態のBackupとRestoreを証拠付きで再実行できること
  - id: platform-surface
    title: Product Architectureと公開Surface
    sequence: 5
    completion_required: true
    exit_criteria:
      - Control PlaneのComponent責任と接続境界を固定Versionの一次資料へ対応付けること
      - ApplicationSet、接続管理、認証認可、HAの主要判断を反証可能なClaimへ分解すること
  - id: operations
    title: 観測と日常運用
    sequence: 6
    completion_required: true
    exit_criteria:
      - Metric、Log、Drift、再同期を同じApplication状態へ接続して診断できること
      - 日常操作の事前条件、成功条件、中断条件をRunbookとして検証できること
  - id: evolution
    title: Version進化とMigration
    sequence: 7
    completion_required: true
    exit_criteria:
      - v3.4からv3.5のBreaking ChangeとMigration前提を固定資料から抽出すること
      - Backup、事前検査、Upgrade、検証、Rollback判断を再実行可能にすること
  - id: skill
    title: Router Skill評価
    sequence: 8
    completion_required: true
    exit_criteria:
      - Routerが質問を正しいCoverage、Claim、Lab、Evidenceへ案内すること
      - Coverage外の要求を捏造せずGapまたは安全な拒否として返すこと
targets:
  - id: application.declarative-model
    title: Application宣言モデル
    target_set: control-loop
    kind: concept
    requirement: required
    state: covered
    rationale: Argo CD v3.5.2のApplicationがSource、Destination、Sync Policyを宣言する境界を固定入力で検証する必要がある。
    claim_ids: [claim.application.desired-state]
    evidence_ids: [evidence.application.v3-5-2]
  - id: reconciliation.continuous-loop
    title: 継続的Reconciliation
    target_set: control-loop
    kind: capability
    requirement: required
    state: covered
    rationale: Live stateの変更後にControllerが望ましい状態との差分を再評価し、期待した状態へ収束することを検証する必要がある。
    claim_ids: [claim.reconciliation.convergence]
    evidence_ids: [evidence.reconciliation.v3-5-2]
  - id: sync.order-and-policy
    title: Sync順序とPolicy
    target_set: delivery
    kind: capability
    requirement: required
    state: covered
    rationale: Argo CD v3.5.2のSync phase、wave、optionがResource適用順序と失敗時の停止条件へ与える影響を検証する必要がある。
    claim_ids: [claim.sync.deterministic-order]
    evidence_ids: [evidence.sync.v3-5-2]
  - id: diff.desired-live-comparison
    title: DesiredとLiveのDiff
    target_set: delivery
    kind: capability
    requirement: required
    state: covered
    rationale: Desired manifestとLive resourceの差分、および明示的なDiff customizationの適用境界を判定できる必要がある。
    claim_ids: [claim.diff.detect-drift]
    evidence_ids: [evidence.diff.v3-5-2]
  - id: health.resource-assessment
    title: Resource Health評価
    target_set: delivery
    kind: capability
    requirement: required
    state: covered
    rationale: Child resourceの状態からApplicationのHealthを評価し、Progressing、Healthy、Degradedを区別できる必要がある。
    claim_ids: [claim.health.aggregate-status]
    evidence_ids: [evidence.health.v3-5-2]
  - id: promotion.git-mediated-change
    title: Gitを介したPromotion
    target_set: delivery
    kind: operation
    requirement: required
    state: covered
    rationale: 環境間PromotionをArgo CD固有の暗黙機能と誤認せず、Git上の監査可能な宣言変更として実証する必要がある。
    claim_ids: [claim.promotion.git-boundary]
    evidence_ids: [evidence.promotion.v3-5-2]
  - id: security.secret-boundary
    title: Secret管理責任の境界
    target_set: security-boundary
    kind: security
    requirement: required
    state: covered
    rationale: Argo CDへSecret平文の生成責任を持たせず、Git、Plugin、Cluster、Evidence間の情報境界を検証する必要がある。
    claim_ids: [claim.security.no-secret-leak]
    evidence_ids: [evidence.security.v3-5-2]
  - id: failure.degraded-dependency
    title: Repository依存障害時の安全な劣化
    target_set: resilience
    kind: failure
    requirement: required
    state: partial
    rationale: Repository sourceの一時停止は実証済みだが、Controller、repo-server、Redis全停止、Network partitionを個別に発生させ、誤った成功判定や無制限な外部影響がないことまで確認する必要がある。
    claim_ids: [claim.failure.safe-degradation]
    evidence_ids: [evidence.failure.v3-5-2]
  - id: recovery.control-plane-restore
    title: Control Plane状態の復旧
    target_set: resilience
    kind: operation
    requirement: required
    state: covered
    rationale: Argo CD v3.5.2の管理状態をBackupから復元し、ApplicationとProjectの意味的状態が再構成されることを検証する必要がある。
    claim_ids: [claim.recovery.restore-state]
    evidence_ids: [evidence.recovery.v3-5-2]
  - id: architecture.control-plane-components
    title: Control Plane Component Architecture
    target_set: platform-surface
    kind: concept
    requirement: required
    state: partial
    rationale: API Server、Repository Server、Application Controllerの責任と資格情報・Manifest・操作の境界を混同せず設計する必要がある。
    claim_ids: [claim.architecture.component-boundaries]
    evidence_ids: [evidence.architecture.v3-5-2, evidence.architecture-container-profile.v3-5-2]
  - id: applicationset.generator-templating
    title: ApplicationSet生成とTemplate
    target_set: platform-surface
    kind: capability
    requirement: required
    state: partial
    rationale: Generator parameterとTemplateから複数Applicationが生成・更新される境界を固定入力で検証する必要がある。
    claim_ids: [claim.applicationset.generated-applications]
    evidence_ids: [evidence.applicationset.v3-5-2]
  - id: connection.repository-cluster-registration
    title: RepositoryとCluster接続
    target_set: platform-surface
    kind: operation
    requirement: required
    state: partial
    rationale: Repository資格情報とCluster接続情報を異なるSecret境界として登録し、到達性と拒否条件を検証する必要がある。
    claim_ids: [claim.connection.register-and-reject]
    evidence_ids: [evidence.connection.v3-5-2]
  - id: sync.hook-wave-lifecycle
    title: HookとWaveのLifecycle
    target_set: delivery
    kind: capability
    requirement: required
    state: partial
    rationale: Sync phase、Hook lifecycle、Wave順序を通常Resourceの適用順序と区別し、失敗時の後続処理を検証する必要がある。
    claim_ids: [claim.sync.hook-wave-lifecycle]
    evidence_ids: [evidence.hook-wave.v3-5-2]
  - id: security.rbac-sso-access-boundary
    title: RBAC・SSO・Secret access境界
    target_set: security-boundary
    kind: security
    requirement: required
    state: partial
    rationale: SSOで得たIdentity、Argo CD RBAC、RepositoryとClusterのSecret accessを分離し、最小権限と拒否を確認する必要がある。
    claim_ids: [claim.security.identity-authorization-boundary]
    evidence_ids: [evidence.access-boundary.v3-5-2]
  - id: availability.high-availability
    title: High Availability構成
    target_set: platform-surface
    kind: construction
    requirement: required
    state: partial
    rationale: ComponentごとのReplica、Shard、Cache依存と単一障害点を識別し、局所的な障害で継続可能な機能を検証する必要がある。
    claim_ids: [claim.availability.component-redundancy]
    evidence_ids: [evidence.high-availability.v3-5-2]
  - id: observability.metrics-logs
    title: MetricとLogによるObservability
    target_set: operations
    kind: operation
    requirement: required
    state: partial
    rationale: Controller、API Server、Repository ServerのMetricと構造化LogをApplication状態および運用判断へ接続する必要がある。
    claim_ids: [claim.observability.correlate-signals]
    evidence_ids: [evidence.observability.v3-5-2]
  - id: drift.tracking-and-refresh
    title: Drift追跡とRefresh
    target_set: operations
    kind: operation
    requirement: required
    state: partial
    rationale: Resource tracking、Diff customization、更新無視を区別し、実際のDriftを隠さず不要なRefreshだけを抑制する必要がある。
    claim_ids: [claim.drift.classify-and-refresh]
    evidence_ids: [evidence.drift.v3-5-2]
  - id: recovery.automated-resynchronization
    title: 自動再同期とSelf-heal
    target_set: operations
    kind: capability
    requirement: required
    state: partial
    rationale: Automated sync、prune、selfHeal、retryの個別条件と安全策を固定し、失敗や空集合で破壊的に動かないことを検証する必要がある。
    claim_ids: [claim.recovery.automated-self-heal]
    evidence_ids: [evidence.auto-recovery.v3-5-2]
  - id: migration.version-upgrade
    title: v3.4からv3.5へのUpgradeとMigration
    target_set: evolution
    kind: migration
    requirement: required
    state: partial
    rationale: v3.5のBreaking Change、Deprecated Surface、事前Backup、事後検証、Rollback判断を一つの移行手順として閉じる必要がある。
    claim_ids: [claim.migration.preflight-and-verify]
    evidence_ids: [evidence.upgrade-migration.v3-5-2]
  - id: operations.routine-control
    title: 日常運用Control
    target_set: operations
    kind: operation
    requirement: required
    state: partial
    rationale: Refresh、Sync、Wait、停止、診断、Backupの事前条件と終了条件を明示し、Operatorが安全に反復できる必要がある。
    claim_ids: [claim.operations.bounded-runbook]
    evidence_ids: [evidence.operations.v3-5-2]
  - id: skill.router-evaluation
    title: Router SkillのCoverage連動評価
    target_set: skill
    kind: skill
    requirement: required
    state: partial
    rationale: Agentがv3.5.2のCoverage内外を識別し、設計、診断、移行、安全拒否を正しい正本へ案内できることを評価する必要がある。
    claim_ids: [claim.skill.coverage-grounded-routing]
    evidence_ids: [evidence.skill-eval.v3-5-2, evidence.skill-definitive-eval.v3-5-2]
  - id: performance.capacity-cost-baseline
    title: 大規模性能・容量・Cost基準
    target_set: operations
    kind: performance
    requirement: required
    state: missing
    rationale: 固定Epochの単一Mac上Kind実証を大規模本番の性能、容量、Cost保証へ一般化しないため、別Benchmark計画へ明示的に分離する。
    claim_ids: []
    evidence_ids: []
  - id: compatibility.broad-version-generator-matrix
    title: Kubernetes・Generator・Plugin広域互換Matrix
    target_set: evolution
    kind: compatibility
    requirement: required
    state: missing
    rationale: v3.5.2と固定Fixtureの実証結果を、複数Kubernetes Version、全Generator、Plugin、Extensionの互換保証へ拡張しない。
    claim_ids: []
    evidence_ids: []
  - id: security.external-idp-interactive-sso
    title: 実IdP対話Login・MFA・Group変化
    target_set: security-boundary
    kind: security
    requirement: required
    state: missing
    rationale: 固定Fixture IdentityとOIDC discoveryの結果を、実Identity ProviderのLogin、MFA、Group lifecycleの保証として扱わない。
    claim_ids: []
    evidence_ids: []
  - id: availability.host-network-rto-rpo
    title: Host・Node・Network partitionとRTO／RPO
    target_set: resilience
    kind: failure
    requirement: required
    state: missing
    rationale: 単一Docker host上の3 node Kindで得たComponent冗長性を、Host障害、Network partition、RTO／RPO保証へ拡張しない。
    claim_ids: []
    evidence_ids: []
  - id: migration.multi-version-rollback-matrix
    title: 複数Version Upgrade・Rollback Matrix
    target_set: evolution
    kind: migration
    requirement: required
    state: missing
    rationale: v3.4.8からv3.5.2への正方向Fixtureを、全patch、Extension、Rollback組合せの互換保証へ一般化しない。
    claim_ids: []
    evidence_ids: []
  - id: observability.distributed-trace-incident-capacity
    title: 分散Trace・Incident rehearsal・Capacity統合
    target_set: operations
    kind: operation
    requirement: required
    state: missing
    rationale: Component MetricとLogの相関Evidenceを、外部Trace backend、実Incident rehearsal、Capacity SLOの保証へ拡張しない。
    claim_ids: []
    evidence_ids: []
  - id: operations.notifications-delivery
    title: Notification Trigger・Template・Subscription・Delivery
    target_set: operations
    kind: operation
    requirement: required
    state: partial
    rationale: Application annotation、local webhook、HTTP 5xx retry、endpoint回復、delivery/trigger metricは実Controllerで検証する。Global subscription、provider固有認証、rate limit、controller再起動をまたぐdeduplication、全Serviceは未検証である。
    claim_ids: [claim.notifications.local-webhook-delivery]
    evidence_ids: [evidence.notifications.v3-5-2]
  - id: system.integrated-reference-gitops
    title: 統合Reference GitOps System
    target_set: platform-surface
    kind: construction
    requirement: required
    state: missing
    rationale: 個別Fixtureだけでなく、ApplicationSet、Project、multi-source、CMP、RBAC、Notification、Observability、Promotion、Recoveryを同一Systemで接続し、横断不変条件を実証する必要がある。
    claim_ids: []
    evidence_ids: []
  - id: architecture.evidence-backed-comparison
    title: Evidenceに基づく設計比較
    target_set: platform-surface
    kind: concept
    requirement: required
    state: missing
    rationale: 複数の構成方式を前提、利点、制約、failure mode、運用Cost、runtime Evidenceで比較し、単一Fixtureを一般解として扱わないために必要である。
    claim_ids: []
    evidence_ids: []
