schema_version: 1
atlas_id: argocd-reference-atlas
epoch: "2026-08-28"
promise: >-
  Argo CD v3.5.2について、初学者が制御ループと責任境界を理解し、実務者とArchitectが方式を選び構築し、
  OperatorとMaintainerが検証・運用・診断・復旧・進化を行い、ReviewerとAgentが一次資料とEvidenceへ戻って判断できる決定版を提供する。
audiences: [learner, practitioner, architect, operator, maintainer, reviewer, educator, agent]
outcomes:
  - id: understand
    title: 原理・公開境界・責任分担を説明できる
    target_sets: [control-loop, delivery, security-boundary, resilience, platform-surface]
  - id: choose
    title: 条件とRiskから構成・同期・昇格・秘密管理方式を選べる
    target_sets: [delivery, security-boundary, resilience, platform-surface, evolution]
  - id: build
    title: 固定Versionから宣言的Delivery経路を構築できる
    target_sets: [control-loop, delivery, security-boundary, platform-surface]
  - id: verify
    title: 主張を再実行可能な試験とEvidenceで反証可能に検証できる
    target_sets: [control-loop, delivery, security-boundary, resilience, platform-surface, operations, evolution, skill]
  - id: operate
    title: 状態を観測し安全な同期・昇格・復旧を運用できる
    target_sets: [delivery, resilience, operations]
  - id: troubleshoot
    title: 差分・Health・依存障害を切り分けて再収束できる
    target_sets: [control-loop, delivery, resilience, operations]
  - id: evolve
    title: 固定Version境界を守り互換性・移行・廃止を判断できる
    target_sets: [delivery, resilience, evolution]
  - id: delegate
    title: Agentへ安全に委任しCoverage・権限・EvidenceをReviewできる
    target_sets: [control-loop, delivery, security-boundary, resilience, platform-surface, operations, evolution, skill]
surfaces:
  - id: orientation-scope
    title: 定義・目的・対象Version・境界
    applicability: required
    rationale: Argo CD本体、GitOps一般、周辺製品、対象外Versionを混同せず正しい入口を選ぶために必要である。
    target_sets: [control-loop, delivery, platform-surface]
    required_deliverables: [concept, decision]
  - id: foundations-mechanics
    title: Reconciliation原理・状態機械・Invariant
    applicability: required
    rationale: Application、Desired/Live、Sync、Diff、Healthが異なる状態を表す理由を説明するために必要である。
    target_sets: [control-loop, delivery]
    required_deliverables: [concept, lab]
  - id: architecture-design
    title: Control plane・信頼境界・Repository設計
    applicability: required
    rationale: Cluster、Project、Repository、Promotion、Secretの責任と権限を保守可能な境界へ分解するために必要である。
    target_sets: [control-loop, security-boundary, resilience, platform-surface]
    required_deliverables: [decision, reference-implementation]
  - id: implementation-construction
    title: 宣言的実装・構築・Bootstrap
    applicability: required
    rationale: 固定SourceとApplication Manifestから実際の同期経路を構築しObservableな状態へ接続するために必要である。
    target_sets: [control-loop, delivery, platform-surface]
    required_deliverables: [reference-implementation, lab]
  - id: testing-verification
    title: Contract・挙動・拒否・相互作用の検証
    applicability: required
    rationale: 正常系だけでなく差分、順序、拒否、障害、復旧の主張を反復可能なOracleで確かめるために必要である。
    target_sets: [control-loop, delivery, security-boundary, resilience, platform-surface, operations, evolution, skill]
    required_deliverables: [test, evidence]
  - id: failure-recovery
    title: 障害・診断・Backup・Restore
    applicability: required
    rationale: RepositoryとControl planeの障害を安全に注入し、管理状態とWorkloadを壊さず復旧するために必要である。
    target_sets: [resilience, operations]
    required_deliverables: [failure-catalog, runbook, evidence]
  - id: operations-observability
    title: 運用・状態・Metric・Log・Trace
    applicability: required
    rationale: Sync、Diff、Health、Queue、依存状態を観測し、運用判断とIncident対応へ結び付けるために必要である。
    target_sets: [delivery, resilience, operations]
    required_deliverables: [runbook, evidence]
  - id: security-privacy-safety
    title: 認証・認可・Secret・Supply chain・安全性
    applicability: required
    rationale: Repository資格情報、Project境界、Cluster権限、生成処理、Evidenceからの秘密漏洩と権限昇格を防ぐために必要である。
    target_sets: [security-boundary, resilience, platform-surface]
    required_deliverables: [security-review, test, evidence]
  - id: performance-capacity-cost
    title: Reconciliation性能・容量・Cost
    applicability: required
    rationale: Application数、Repository構成、Cache、Queue、Shardが遅延・Resource消費・運用Costへ与える影響を判断するために必要である。
    target_sets: [control-loop, resilience, platform-surface, operations]
    required_deliverables: [benchmark, evidence]
  - id: compatibility-integration
    title: Kubernetes・Source・API・Extension互換性
    applicability: required
    rationale: 対応Kubernetes、Manifest generator、API、CLI、ExtensionのVersion差と統合境界を検証するために必要である。
    target_sets: [control-loop, delivery, resilience, platform-surface, evolution]
    required_deliverables: [test, evidence]
  - id: migration-evolution-deprecation
    title: Upgrade・Migration・Deprecation
    applicability: required
    rationale: minor更新、削除予定Surface、Manifest差分、BackupとRollback条件を明示して安全に進化させるために必要である。
    target_sets: [delivery, resilience, evolution]
    required_deliverables: [migration-guide, test]
  - id: decision-comparison
    title: 選択・比較・Trade-off
    applicability: required
    rationale: Topology、Sync option、Promotion、Secret、Recovery方式を同じ制約とFailure modelで比較するために必要である。
    target_sets: [control-loop, delivery, security-boundary, resilience, platform-surface, operations, evolution]
    required_deliverables: [decision, benchmark]
  - id: provenance-rights
    title: 一次資料・来歴・権利・SBOM
    applicability: required
    rationale: 固定Versionの根拠、実装の独自性、第三者依存、再配布可否、生成Evidenceの来歴を追跡するために必要である。
    target_sets: [control-loop, delivery, security-boundary, resilience, platform-surface, operations, evolution, skill]
    required_deliverables: [provenance-record, evidence]
  - id: agent-skill
    title: Router Skill・権限境界・評価
    applicability: required
    rationale: AgentがCoverage外を捏造せず、適切な設計、Lab、Evidence、Runbookへ到達して安全に委任を実行するために必要である。
    target_sets: [control-loop, delivery, security-boundary, resilience, platform-surface, operations, evolution, skill]
    required_deliverables: [skill-reference, skill-eval]
