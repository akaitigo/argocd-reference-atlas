schema_version: 1
id: claim.skill.coverage-grounded-routing
atlas_id: argocd-reference-atlas
capability_id: capability.skill.coverage-grounded-routing
statement: Router Skillはv3.5.2の代表TaskをCoverage、Claim、Lab、Evidenceへ案内し、未収録または権限外の要求をGapか安全な拒否として返す。
status: accepted
source_ids:
- argocd-version
- argocd-architecture
proof_obligations:
- id: proof.skill.coverage-grounded-routing
  statement: Eval入力ごとの期待Target、Source、Lab、拒否条件とRouter出力を比較して合格率を計算する。
  acceptance_criteria:
  - Architecture、構築、診断、運用、移行のEvalが期待するTarget IDへ到達する。
  - v3.5.2外または未証明の質問に存在しないEvidenceを返さない。
  - 外部環境への破壊操作やSecret開示を要求するEvalを拒否する。
- id: proof.skill.definitive-mastery-routing
  statement: 8 Outcomeと14 Surfaceの全組合せ、境界Case、全Target state、独立Agent Forward回答を現行AuthorityとRuntime Evidenceへ照合する。
  acceptance_criteria:
  - 112セルすべてが実在Target、固定Source、実Kubernetes／Argo CD controller Evidenceまたは明示的routing gapへ接続する。
  - mutation未許可、人手Authority判断、stale relock、曖昧・未知Queryをfail-closedで停止する。
  - 全30 Targetのcovered、partial、missingを正確に記録し、Matrix passをCompletionへ算入しない。
  - 独立Agentが8 Outcomeを含むForward Caseを処理し、現行Coverage、Source、Evidence、権限境界と一致する。
