schema_version: 1
atlas_id: argocd-reference-atlas
product_version: v3.5.2
proof_obligations:
  - id: proof.application.desired-state
    claim_id: claim.application.desired-state
    required_profile: cluster
    lab_id: lab.application
    expected_evidence_id: evidence.application.v3-5-2
    oracle: Applicationの正規化済みspecとstatusを入力Manifestおよび対象Resourceと比較する。
    state: covered
  - id: proof.reconciliation.convergence
    claim_id: claim.reconciliation.convergence
    required_profile: cluster
    lab_id: lab.reconciliation
    expected_evidence_id: evidence.reconciliation.v3-5-2
    oracle: Drift導入前後とSync後のApplication sync statusおよびResource値を比較する。
    state: covered
  - id: proof.sync.deterministic-order
    claim_id: claim.sync.deterministic-order
    required_profile: cluster
    lab_id: lab.sync
    expected_evidence_id: evidence.sync.v3-5-2
    oracle: Resource annotation、event、operation resultからwave境界と失敗時の停止を判定する。
    state: covered
  - id: proof.diff.detect-drift
    claim_id: claim.diff.detect-drift
    required_profile: cluster
    lab_id: lab.diff
    expected_evidence_id: evidence.diff.v3-5-2
    oracle: 同期状態とDiff出力を既知の変更集合およびignoreDifferences集合と比較する。
    state: covered
  - id: proof.health.aggregate-status
    claim_id: claim.health.aggregate-status
    required_profile: cluster
    lab_id: lab.health
    expected_evidence_id: evidence.health.v3-5-2
    oracle: FixtureのReady条件とApplication health statusの対応を状態遷移ごとに比較する。
    state: covered
  - id: proof.promotion.git-boundary
    claim_id: claim.promotion.git-boundary
    required_profile: cluster
    lab_id: lab.promotion
    expected_evidence_id: evidence.promotion.v3-5-2
    oracle: Promotion前後のGit Revision、Application observed revision、Resource値を同一記録で照合する。
    state: covered
  - id: proof.security.no-secret-leak
    claim_id: claim.security.no-secret-leak
    required_profile: cluster
    lab_id: lab.security
    expected_evidence_id: evidence.security.v3-5-2
    oracle: 既知Canary値をRepositoryとEvidenceへ照合し、出現数がゼロであることを検査する。
    state: covered
  - id: proof.failure.safe-degradation
    claim_id: claim.failure.safe-degradation
    required_profile: cluster
    lab_id: lab.failure
    expected_evidence_id: evidence.failure.v3-5-2
    oracle: 障害注入、異常状態、依存復旧、再評価の順序を時刻付きCaptureで検証する。
    state: covered
  - id: proof.recovery.restore-state
    claim_id: claim.recovery.restore-state
    required_profile: cluster
    lab_id: lab.recovery
    expected_evidence_id: evidence.recovery.v3-5-2
    oracle: Backup前後で主要CRの正規化済みspec集合とArgo CD Versionを比較する。
    state: covered
  - id: proof.architecture.component-boundaries
    claim_id: claim.architecture.component-boundaries
    required_profile: cluster
    lab_id: lab.architecture
    expected_evidence_id: evidence.architecture.v3-5-2
    oracle: 実行中Workload、ServiceAccount、Service、Network endpointを公式Component責任表へ対応付ける。
    state: covered
  - id: proof.applicationset.generated-applications
    claim_id: claim.applicationset.generated-applications
    required_profile: cluster
    lab_id: lab.applicationset
    expected_evidence_id: evidence.applicationset.v3-5-2
    oracle: Generator入力と生成後Applicationの正規化済みspec集合を要素単位で比較する。
    state: covered
  - id: proof.connection.register-and-reject
    claim_id: claim.connection.register-and-reject
    required_profile: cluster
    lab_id: lab.connection
    expected_evidence_id: evidence.connection.v3-5-2
    oracle: 有効・無効FixtureごとのRepositoryとCluster接続状態を比較し、Credential値を伏せて判定する。
    state: covered
  - id: proof.sync.hook-wave-lifecycle
    claim_id: claim.sync.hook-wave-lifecycle
    required_profile: cluster
    lab_id: lab.hook-wave
    expected_evidence_id: evidence.hook-wave.v3-5-2
    oracle: Operation result、Resource作成時刻、Hook削除後集合からphase、wave、cleanupの順序を検証する。
    state: covered
  - id: proof.security.identity-authorization-boundary
    claim_id: claim.security.identity-authorization-boundary
    required_profile: cluster
    lab_id: lab.access-boundary
    expected_evidence_id: evidence.access-boundary.v3-5-2
    oracle: Fixture主体ごとの許可・拒否MatrixをRBAC policyと照合し、認証情報を伏せて判定する。
    state: covered
  - id: proof.availability.component-redundancy
    claim_id: claim.availability.component-redundancy
    required_profile: cluster
    lab_id: lab.high-availability
    expected_evidence_id: evidence.high-availability.v3-5-2
    oracle: Replica構成、Pod停止、read probe、Replica回復の時系列を比較し、保証した機能範囲だけを合格とする。
    state: covered
  - id: proof.observability.correlate-signals
    claim_id: claim.observability.correlate-signals
    required_profile: cluster
    lab_id: lab.observability
    expected_evidence_id: evidence.observability.v3-5-2
    oracle: 既知操作の時刻とApplication状態、Component metric、構造化Logを共通識別子で相関する。
    state: covered
  - id: proof.drift.classify-and-refresh
    claim_id: claim.drift.classify-and-refresh
    required_profile: cluster
    lab_id: lab.drift
    expected_evidence_id: evidence.drift.v3-5-2
    oracle: 意味的spec変更と無視対象Field更新を別々に注入し、Refresh、Diff、Tracking結果を比較する。
    state: covered
  - id: proof.recovery.automated-self-heal
    claim_id: claim.recovery.automated-self-heal
    required_profile: cluster
    lab_id: lab.auto-recovery
    expected_evidence_id: evidence.auto-recovery.v3-5-2
    oracle: selfHeal前後のLive value、prune無効時のResource集合、retry時刻列を宣言Policyと比較する。
    state: covered
  - id: proof.migration.preflight-and-verify
    claim_id: claim.migration.preflight-and-verify
    required_profile: cluster
    lab_id: lab.upgrade-migration
    expected_evidence_id: evidence.upgrade-migration.v3-5-2
    oracle: Preflight結果、Backup Digest、Version遷移、主要CRとApplication状態を移行Acceptance Criteriaへ照合する。
    state: covered
  - id: proof.operations.bounded-runbook
    claim_id: claim.operations.bounded-runbook
    required_profile: cluster
    lab_id: lab.operations
    expected_evidence_id: evidence.operations.v3-5-2
    oracle: Runbook各操作の対象確認、有限Timeout、終了Code、Cleanup後Resource集合を検査する。
    state: covered
  - id: proof.skill.coverage-grounded-routing
    claim_id: claim.skill.coverage-grounded-routing
    required_profile: local
    lab_id: lab.skill-eval
    expected_evidence_id: evidence.skill-eval.v3-5-2
    oracle: Eval入力ごとの期待Target、Source、Lab、拒否条件とRouter出力を比較して合格率を計算する。
    state: covered
  - id: proof.notifications.local-webhook-delivery
    claim_id: claim.notifications.local-webhook-delivery
    required_profile: cluster
    lab_id: lab.notifications
    expected_evidence_id: evidence.notifications.v3-5-2
    oracle: Application状態、ReceiverのHTTP 200/503 event列、Notification controller logとdelivery/trigger metricを同一attemptで照合する。
    state: covered
