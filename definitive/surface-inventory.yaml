evidence_bindings:
  - evidence_id: evidence.application.v3-5-2
    item_ids: [application.spec.sources, application.spec.destination, application.spec.project, application.spec.sync-policy]
    bounded_scope: 単一source、in-cluster destination、default Project、固定manual sync Fixture。
  - evidence_id: evidence.operations.v3-5-2
    item_ids: [application.operation.refresh, application.operation.wait]
    bounded_scope: 固定Applicationのrefresh、wait、export/import操作。
  - evidence_id: evidence.sync.v3-5-2
    item_ids: [application.operation.sync, sync.options]
    bounded_scope: 固定Resource集合と限定Sync option。
  - evidence_id: evidence.applicationset.v3-5-2
    item_ids: [applicationset.template, applicationset.generator.list, applicationset.deletion]
    bounded_scope: List generatorのblue/green生成、template一致、element削除。
  - evidence_id: evidence.access-boundary.v3-5-2
    item_ids: [applicationset.any-namespace, project.source-boundary, project.destination-boundary, project.resource-boundary, project.roles, auth.local-account, auth.external-oidc, auth.rbac-policy, auth.permission-check, recovery.idp-outage]
    bounded_scope: 固定Identity、RBAC allow/deny、OIDC discovery/provider outage。interactive login、MFA、group lifecycleは含まない。
  - evidence_id: evidence.connection.v3-5-2
    item_ids: [connection.repository-secret, connection.cluster-secret, connection.cluster-namespaces]
    bounded_scope: 単一local repositoryとnamespace限定cluster登録、到達不能endpoint拒否。
  - evidence_id: evidence.auto-recovery.v3-5-2
    item_ids: [sync.automated-prune-selfheal, sync.retry]
    bounded_scope: 固定Applicationのautomated sync、selfHeal、retry。
  - evidence_id: evidence.hook-wave.v3-5-2
    item_ids: [sync.hooks, sync.waves]
    bounded_scope: 固定PreSync/Sync/PostSync Fixtureとwave順序。
  - evidence_id: evidence.diff.v3-5-2
    item_ids: [diff.ignore-rules]
    bounded_scope: 固定Deployment driftと限定ignore rule。
  - evidence_id: evidence.health.v3-5-2
    item_ids: [health.built-in, health.lua-customization]
    bounded_scope: 固定workloadのHealthy/Progressing/Degradedと固定customization。
  - evidence_id: evidence.drift.v3-5-2
    item_ids: [tracking.methods]
    bounded_scope: 固定tracking設定とmanual live drift。
  - evidence_id: evidence.security.v3-5-2
    item_ids: [secret.repository-cluster-boundary, secret.manifest-generation]
    bounded_scope: 固定Git/Cluster/EvidenceのSecret data非保存検査。
  - evidence_id: evidence.high-availability.v3-5-2
    item_ids: [ha.api-server, ha.repo-server, ha.redis, recovery.component-failure]
    bounded_scope: 3-node Kind、Application Controller/repo-server/Redis master Pod UID交代、Controller復旧後Drift再収束、repo-server復旧後Hard Refresh、Redis障害窓中read/metrics。host/network、全replica停止、shard交代は含まない。
  - evidence_id: evidence.observability.v3-5-2
    item_ids: [observe.metrics.controller, observe.metrics.server, observe.metrics.repo-server, observe.logs.correlation]
    bounded_scope: 固定sync時刻周辺のcomponent metrics/logs。trace、SLO、incidentは含まない。
  - evidence_id: evidence.recovery.v3-5-2
    item_ids: [recovery.export-import]
    bounded_scope: 固定Application/AppProjectのadmin export/importとspec digest一致。
  - evidence_id: evidence.failure.v3-5-2
    item_ids: [recovery.repository-outage]
    bounded_scope: 単一source-server停止中のComparisonErrorと復旧後再収束。
  - evidence_id: evidence.upgrade-migration.v3-5-2
    item_ids: [migration.preflight-backup, migration.forward-3.4-3.5]
    bounded_scope: Kind v1.34.0上のv3.4.8からv3.5.2への正方向Upgrade。実Rollbackは含まない。
